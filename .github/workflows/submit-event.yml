name: Fake Open Source event saving

on:
  issues:
    types:
      - opened

jobs:
  store:
    runs-on: ubuntu-latest
    if: "contains(github.event.issue.labels.*.name, 'event')"
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - id: issue-parser
        uses: stefanbuck/github-issue-parser@v3
        with:
          template-path: ".github/ISSUE_TEMPLATE/Fake-Open-Source-event.yml"

      - name: Save issue to Markdown & YAML
        run: |
          START_TIME="${{ steps.issue-parser.outputs.issueparser_start_time }}"
          DATE_PART=$(echo "$START_TIME" | grep -oE '[0-9]{4}[-/][0-9]{2}[-/][0-9]{2}' | head -n1 | tr '/' '-')

          if [ -z "$DATE_PART" ]; then
            echo "Unable to parse start_time: $START_TIME"
            exit 1
          fi

          IFS='-' read -r YEAR MONTH DAY <<< "$DATE_PART"

          SAFE_TITLE=$(echo "${{ github.event.issue.title }}" | \
            sed 's#[\\/:*?"<>|]#-#g; s/[[:space:]]\+/-/g; s/--\+/-/g; s/^-//; s/-$//')

          if [ -z "$SAFE_TITLE" ]; then
            SAFE_TITLE="issue-${{ github.event.issue.number }}"
          fi

          FILE_PATH="data/$YEAR/$MONTH/$DAY/$SAFE_TITLE.md"
          mkdir -p "$(dirname "$FILE_PATH")"

          ISSUE_TITLE="${{ github.event.issue.title }}"
          ISSUE_BODY="${{ github.event.issue.body }}"
          {
            printf '# %s\n\n' "$ISSUE_TITLE"
            printf '%s\n' "$ISSUE_BODY"
          } > "$FILE_PATH"

          cat << EOF >> data/events.yml
          - issue_link: "${{ github.event.issue.html_url }}"
            file_path: "$FILE_PATH"
            title: "${{ github.event.issue.title }}"
            tags: "${{ steps.issue-parser.outputs.issueparser_tags }}"
            start_time: "${{ steps.issue-parser.outputs.issueparser_start_time }}"
            end_time: "${{ steps.issue-parser.outputs.issueparser_end_time }}"
            location: "${{ steps.issue-parser.outputs.issueparser_location }}"
            whistleblower: "${{ github.event.issue.user.html_url }}"
            hypocrite: |
              ${{ steps.issue-parser.outputs.issueparser_hypocrite }}
            money: "${{ steps.issue-parser.outputs.issueparser_money }}"
          EOF

      - uses: peter-evans/create-pull-request@v8
        with:
          title: "docs(event): add data of ${{ github.event.issue.title }}"
          body: "fix #${{ github.event.issue.number }}"
