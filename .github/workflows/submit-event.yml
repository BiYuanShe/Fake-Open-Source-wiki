name: Fake Open Source event saving

on:
  issues:
    types:
      - opened

jobs:
  store:
    runs-on: ubuntu-latest
    if: "contains(github.event.issue.labels.*.name, 'event')"
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - id: issue-parser
        uses: stefanbuck/github-issue-parser@v3
        with:
          template-path: ".github/ISSUE_TEMPLATE/Fake-Open-Source-event.yml"

      - name: Add data to YAML
        run: |
          cat << EOF >> data/events.yml
          - title: "${{ github.event.issue.title }}"
            tags: "${{ steps.issue-parser.outputs.issueparser_tags }}"
            start_time: "${{ steps.issue-parser.outputs.issueparser_start_time }}"
            end_time: "${{ steps.issue-parser.outputs.issueparser_end_time }}"
            location: "${{ steps.issue-parser.outputs.issueparser_location }}"
            whistleblower: "${{ github.event.issue.user.html_url }}"
            involved_people: |
              ${{ steps.issue-parser.outputs.issueparser_involved_people }}
            event_details: |
              ${{ steps.issue-parser.outputs.issueparser_event_details }}
            money: "${{ steps.issue-parser.outputs.issueparser_money }}"
            assets: |
              ${{ steps.issue-parser.outputs.issueparser_assets }}
          EOF

      - uses: peter-evans/create-pull-request@v8
        with:
          title: "docs(event): add data of ${{ github.event.issue.title }}"
          body: "fix #${{ github.event.issue.number }}"
